# Mango Key Bindings - consolidated
# dms/binds.conf is sourced AFTER this file - last wins on conflicts

# --- Focus: active window ---
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,a,focusdir,left
bind=SUPER,d,focusdir,right
bind=ALT,Tab,focusstack,next

# --- Move active window: same screen ---
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# --- Move active window: another screen ---
bind=SUPER+CTRL,Left,tagmon,left
bind=SUPER+CTRL,Right,tagmon,right

# --- Move active window: another workspace ---
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+ALT,1,tagsilent,1
bind=SUPER+ALT,2,tagsilent,2
bind=SUPER+ALT,3,tagsilent,3
bind=SUPER+ALT,4,tagsilent,4
bind=SUPER+ALT,5,tagsilent,5
bind=SUPER+ALT,6,tagsilent,6
bind=SUPER+ALT,7,tagsilent,7
bind=SUPER+ALT,8,tagsilent,8
bind=SUPER+ALT,9,tagsilent,9

# --- Workspaces: navigation ---
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,w,viewtoleft
bind=SUPER,s,viewtoright
# removed tagsilent,special

# --- Window proportions and resizing ---
bind=SUPER+CTRL,a,switch_proportion_preset,previous
bind=SUPER+CTRL,d,switch_proportion_preset,next
bind=SUPER+SHIFT+CONTROL,Left,resizewin,-30,+0
bind=SUPER+SHIFT+CONTROL,Right,resizewin,+30,+0
bind=SUPER+SHIFT+CONTROL,Up,resizewin,+0,-30
bind=SUPER+SHIFT+CONTROL,Down,resizewin,+0,+30
mousebind=NONE,btn_forward,resizewin,-10,0
mousebind=super,btn_back,resizewin,0,+10
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# --- Window management ---
bind=SUPER,q,killclient,
bind=ALT,F4,killclient,
bind=SUPER,g,togglefloating,
bind=SUPER,f,togglefullscreen
bind=SUPER,m,togglemaximizescreen
bind=SUPER+SHIFT,grave,minimized
bind=SUPER,grave,toggle_scratchpad,
bind=SUPER,x,toggleglobal,

# --- Overview ---
bind=SUPER,z,toggleoverview
bind=SUPER+SHIFT,D,toggleoverview

# --- Layout ---
bind=SUPER+CTRL,l,spawn,/home/loops/.config/mango/scripts/toggle-layout.sh

# --- System ---
bind=SUPER,r,reload_config
bind=SUPER,Delete,quit,

# --- Launchers ---
bind=SUPER,t,spawn,kitty
bind=SUPER,b,spawn,/usr/bin/zen-browser
bind=SUPER,e,spawn,dolphin
bind=SUPER,o,spawn,obsidian

# --- DMS ---
bind=SUPER,comma,spawn,dms ipc call settings focusOrToggle
bind=SUPER+SHIFT,m,spawn,dms ipc call processlist focusOrToggle
bind=SUPER,n,spawn,dms ipc call notifications toggle
bind=SUPER,space,spawn,dms ipc call spotlight toggle
bind=SUPER,Super_L,spawn,dms ipc call spotlight toggle
bind=SUPER,v,spawn,dms ipc call clipboard toggle
bind=SUPER,y,spawn,dms ipc call dankdash wallpaper
bind=SUPER+SHIFT,f,spawn,dms ipc call bar toggle index 0

# --- Utilities ---
bind=SUPER,p,spawn,hyprpicker -an
# bind=none,Insert,spawn,dictaway

# --- Hardware controls ---
bind=none,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 5
bind=none,XF86AudioMicMute,spawn,dms ipc call audio micmute
bind=none,XF86AudioMute,spawn,dms ipc call audio mute
bind=none,XF86AudioPlay,spawn,dms ipc call mpris playPause
bind=none,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 5
bind=none,XF86MonBrightnessDown,spawn,dms ipc call brightness decrement 5
bind=none,XF86MonBrightnessUp,spawn,dms ipc call brightness increment 5

# --- Screenshots ---
bind=none,Print,spawn,/home/loops/.config/mango/scripts/screenshot.sh
