# setlayout is a command, not a config keyword (set via tagrule instead)
sloppyfocus=0
warpcursor=0
smartgaps=1
drag_tile_to_tile=1
drag_corner=4

# Scroller layout settings
scroller_structs=1
scroller_proportion_preset=0.5,0.8,1.0
scroller_default_proportion=0.5

# Force scroller on tags 1-3 (vertical columns)
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller

# Tag 5 — gaming, floating windows
tagrule=id:5,open_as_floating:1

# Tag 9 — monocle on eDP-1 (fullscreen single window, no borders)
tagrule=id:9,monitor_name:eDP-1,layout_name:monocle
tagrule=id:9,no_render_border:1

# Overview: toggle mode (press to open, press again to close)
ov_tab_mode=0
